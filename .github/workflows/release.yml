name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build
      - run: pip install -e ".[dev]"
      - run: pytest -q

      - name: Check the tag matches the project version
        run: |
          version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - run: python -m build

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl

      - name: Smoke-test the installed CLI
        env:
          HELIOS_DB: /tmp/smoke/helios.db
        run: |
          /tmp/clean/bin/helios --help
          /tmp/clean/bin/helios report

      - uses: pypa/gh-action-pypi-publish@release/v1
